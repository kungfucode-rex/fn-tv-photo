# 图评 (tuping) —— 这一份就够了（docs/tuping-design.md §17.22）。
#
# 它拉取已经构建好的镜像，所以不需要 Dockerfile、不需要二进制、不需要在同一个目录里放别的东西：
# 在飞牛「Docker 应用 → Compose → 新增项目」里把这一份粘进去，改一行口令，点「启动」即可。
# 架构（amd64 / arm64）由镜像本身的多架构清单决定，不用你选。
#
# 唯一要改的一行是 TUPING_ADMIN_TOKEN。
services:
  tuping:
    # 换成发布镜像的那个命名空间。镜像发布在 Docker Hub，用国内加速源可以拉。
    # 0.1.1 起服务端自己会说 HTTPS；0.1.0 及更早的镜像没有 TLS 那段代码。
    image: kungfucode/tuping:0.1.2
    container_name: tuping
    restart: unless-stopped
    ports:
      # 左边是 NAS 上的端口。要开 HTTPS 就把它改成 "443:8080"（见下面 environment 里那段注释），
      # 二维码里的地址会跟着变成 https://<域名>/c/<短码>，不带端口。
      - "8080:8080"

    # 数据目录的属主：镜像自己会处理 —— 容器以 root 起步，二进制把 data/（含里面已有的
    # 文件）的属主交给 uid 10001，然后立刻放弃 root（日志里一行 "running unprivileged"）。
    # 所以这里什么都不用做；只有挂载在 SMB/CIFS 上（不支持 chown）才需要加 user: "0:0"。

    volumes:
      # 相对路径，按 compose 文件所在的目录解析：数据落在项目目录下的 data/。
      - ./data:/data

    environment:
      # 改这一行：管理员的密码，登录 http://<这台 NAS 的地址>:8080/admin 时手打。
      # 留空 = 没有管理员（评论页不会出现「管理员登录」）。
      TUPING_ADMIN_TOKEN: "change-me"

      # 其余都有默认值，按需取消注释：
      #
      # 二维码里的地址默认取"谁在连"的那个地址（电视注册照片时会把自己用的地址报上来）。
      # 只有反向代理改写了 Host 之类的情况才需要钉死；钉错了不会报错，只会让二维码扫了打不开。
      # TUPING_BASE_URL: "http://192.168.31.14:8080"
      #
      # 签名密钥第一次启动自动生成，存在数据目录的 secret 里；填了就是固定/轮换它。
      # TUPING_SECRET: "<openssl rand -base64 32>"
      #
      # 要求注册照片时带共享令牌（办公室/宿舍这类不信任局域网时用）。
      # TUPING_REGISTER_TOKEN: "<optional>"
      #
      # HTTPS：证书和私钥是你的事（ACME 客户端写到一个目录里是最常见的形状），服务器只负责
      # 用它们服务。
      #
      # 但先看这一条：**0.1.0 及更早的镜像里没有 TLS 这段代码**，设了下面两个变量它们既不生效
      # 也不报错 —— 现象就是 http 照常、https 连不上（上面 pin 的 0.1.2 有）。确认正在跑的
      # 那个二进制认不认：
      #   docker exec tuping /usr/local/bin/tupingd -check | grep '^tls'
      # 有输出（off 或 on）就是认识；一行都没有就是太旧。
      #
      # 两个变量给两个文件的路径，并且都要能被 uid 10001 读到；只设一个会**启动失败并点名缺的
      # 那个**，而不是悄悄退回明文。证书文件被换掉之后服务器会自己重读，续期不需要重启
      # （docs/tuping-design.md §17.23）。
      #
      # 在这份文件里就是服务上加一个挂载、这里加两个键：
      #   volumes:     - /vol1/docker/tuping/certs:/certs:ro
      #   environment: TUPING_TLS_CERT: "/certs/fullchain.pem"
      #                TUPING_TLS_KEY:  "/certs/privkey.pem"
      #
      # 然后端口映射改成 "443:8080"。地址可以钉死（域名必须和证书对得上）：
      # TUPING_BASE_URL: "https://photos.example.com"
      # 也可以留空 —— 电视注册照片时会把自己连通的那个地址报上来，那里天然就是 https。
      #
      # 日志时间戳的时区，镜像里已经是 Asia/Shanghai。
      # TZ: "Asia/Shanghai"

    healthcheck:
      # 两段是有意的：前一段是二进制自己的 -health，它按环境变量里配置的协议去探测自己，所以
      # 明文和 HTTPS 都对，而且不会每分钟往日志里留一行失败的 TLS 握手；后一段是给 0.1.0 这类
      # 更早的镜像兜底（它们还没有 -health，明文 http 直接就能答）。任意一段成功即健康。
      # 用 wget 直接探 https 是不行的：证书从来不是签给 127.0.0.1 的，结论永远是"不健康"（§17.23）。
      test: ["CMD-SHELL", "/usr/local/bin/tupingd -health || wget -q -O - http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        # 日志是 NAS 出问题时唯一的证据，但也不能让它把磁盘写满。
        max-size: "10m"
        max-file: "3"
